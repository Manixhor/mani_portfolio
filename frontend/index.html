<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio website." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="application-name" content="Mani Portfolio" />
  <meta name="apple-mobile-web-app-title" content="Mani Portfolio" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Portfolio" />
  <meta property="og:description" content="Portfolio website." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=1200&q=80" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icons/icon.svg" />
  <link rel="stylesheet" href="/static/css/style.css?v=22" />
</head>
<body>
  <div id="progress-bar" aria-hidden="true"></div>

  <main class="portfolio-shell">
    <nav class="top-nav" aria-label="Primary navigation">
      <a class="nav-brand" href="#hero" aria-label="Go to home">Mani</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-nav" data-nav-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-links" id="primary-nav" data-nav-links>
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="/blogs/">Blogs</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>

    <section id="hero" class="hero-panel section-panel">
      <div class="hero-card">
        <h1 data-content="hero-title"></h1>
        <p class="signature" data-content="hero-name"></p>
        <p class="hero-role" data-content="hero-tagline"></p>
        <a class="year-pill" href="#experience" data-content="hero-year"></a>
      </div>
    </section>

    <section id="about" class="about-panel section-panel split-panel">
      <div class="section-copy">
        <p class="section-kicker" data-content="about-label"></p>
        <h2 data-content="about-heading"></h2>
        <div data-render="about-paragraphs"></div>
        <a class="outline-button" href="#" data-content="resume-link"></a>
      </div>
      <div class="image-panel about-image">
        <img src="" alt="" loading="lazy" referrerpolicy="no-referrer" data-content="about-image" />
      </div>
    </section>

    <section id="experience" class="experience-panel section-panel">
      <div class="section-heading">
        <p class="section-kicker" data-content="experience-label"></p>
        <h2 data-content="experience-heading"></h2>
      </div>
      <div data-render="experience"></div>
    </section>

    <section id="skills" class="skills-panel section-panel">
      <div class="section-heading">
        <p class="section-kicker" data-content="skills-label"></p>
        <h2 data-content="skills-heading"></h2>
      </div>
      <div class="skills-grid" aria-label="Technical skills" data-render="skills"></div>
    </section>

    <section id="projects" class="projects-panel section-panel">
      <div class="section-heading">
        <p class="section-kicker" data-content="projects-label"></p>
        <h2 data-content="projects-heading"></h2>
      </div>
      <div class="project-grid" data-render="projects"></div>
    </section>

    <section id="contact" class="contact-panel section-panel split-panel">
      <div class="section-copy">
        <p class="section-kicker" data-content="contact-label"></p>
        <h2 data-content="contact-heading"></h2>
        <div data-render="contact-copy"></div>

        <ul class="contact-list" data-render="contact-list"></ul>

        <div class="social-links" aria-label="Social links" data-render="social-links"></div>

      </div>

    </section>
  </main>

  <div class="project-modal" id="project-modal" aria-hidden="true">
    <div class="project-modal__backdrop" data-close-modal></div>
    <section class="project-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="project-modal__close" type="button" aria-label="Close project details" data-close-modal>&times;</button>
      <p class="project-modal__eyebrow">Project brief</p>
      <h2 id="modal-title"></h2>
      <p id="modal-brief"></p>
      <span id="modal-stack"></span>
      <div class="project-modal__links">
        <a id="modal-live" href="#" target="_blank" rel="noopener noreferrer">Live Link</a>
        <a id="modal-github" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a id="modal-blog" href="#" target="_blank" rel="noopener noreferrer">Read Blog</a>
      </div>
    </section>
  </div>

  <aside class="chatbot-widget" data-chatbot aria-label="Contact assistant">
    <button class="chatbot-widget__launcher" type="button" data-chatbot-open><span class="chatbot-widget__signal" aria-hidden="true"></span>Start a conversation</button>
    <section class="chatbot-widget__window" data-chatbot-window hidden>
      <header><div><p>Mani's assistant</p><span>Available to talk</span></div><button type="button" data-chatbot-close aria-label="Close assistant">&times;</button></header>
      <form data-chatbot-form>
        <div class="chatbot-widget__messages" data-chatbot-messages role="log" aria-live="polite"></div>
        <div class="chatbot-widget__choices" data-chatbot-choices></div>
        <label class="sr-only" data-chatbot-input-label></label>
        <div class="chatbot-widget__composer"><div data-chatbot-input-slot></div><button type="submit" data-chatbot-submit hidden>Next</button></div>
        <p class="chatbot-widget__status" data-chatbot-status aria-live="polite"></p>
      </form>
    </section>
  </aside>

  <script src="/app.js?v=17"></script>
  <script src="/chat-widget.js?v=3"></script>
</body>
</html>
