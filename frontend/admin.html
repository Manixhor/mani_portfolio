<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portfolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=15" />
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header"><a href="/" class="nav-brand">Mani</a><a href="/blogs/admin/">Blog editor</a></header>
    <section class="admin-login" data-admin-login>
      <p class="section-kicker">Private area</p>
      <h1>Portfolio Admin</h1>
      <form data-admin-login-form>
        <label>Admin password<input type="password" autocomplete="current-password" required data-admin-password /></label>
        <button type="submit">Open dashboard</button>
      </form>
      <p data-admin-login-status aria-live="polite"></p>
    </section>
    <section class="admin-dashboard" data-admin-dashboard hidden>
      <div class="admin-dashboard__heading"><div><p class="section-kicker">Content manager</p><h1>Portfolio Content</h1></div><button type="button" data-admin-save>Save all changes</button></div>
      <p class="admin-status" data-admin-status aria-live="polite"></p>
      <section class="admin-section"><h2>Site Content</h2><div class="admin-fields" data-admin-site-fields></div></section>
      <section class="admin-section"><div class="admin-section__header"><h2>Experience</h2><button type="button" data-admin-add="experience">Add role</button></div><div class="admin-items" data-admin-collection="experience"></div></section>
      <section class="admin-section"><div class="admin-section__header"><h2>Technical Skills</h2><button type="button" data-admin-add="skills">Add skill</button></div><div class="admin-items" data-admin-collection="skills"></div></section>
      <section class="admin-section"><div class="admin-section__header"><h2>Projects</h2><button type="button" data-admin-add="projects">Add project</button></div><div class="admin-items" data-admin-collection="projects"></div></section>
      <section class="admin-section"><div class="admin-section__header"><h2>Certifications</h2><button type="button" data-admin-add="certifications">Add certification</button></div><div class="admin-items" data-admin-collection="certifications"></div></section>
    </section>
  </main>
  <script src="/admin.js?v=2"></script>
</body>
</html>
