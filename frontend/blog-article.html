<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A blog article by Mani." />
  <meta name="theme-color" content="#ffffff" />
  <title>Blog | Mani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=26" />
</head>
<body class="blog-page article-page">
  <main class="portfolio-shell">
    <nav class="top-nav" aria-label="Primary navigation">
      <a class="nav-brand" href="/" aria-label="Go to home">Mani</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-nav" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="primary-nav" data-nav-links>
        <a href="/#hero">Home</a><a href="/#about">About</a><a href="/#experience">Experience</a><a href="/#projects">Projects</a><a href="/#skills">Skills</a><a href="/blogs/">Blogs</a><a href="/#contact">Contact</a>
      </div>
    </nav>

    <article class="article-shell" data-article>
      <a class="article-back" href="/blogs/">Back to blogs</a>
      <p class="blogs-kicker" data-article-date></p>
      <h1 data-article-title>Loading article...</h1>
      <p class="article-subtitle" data-article-subtitle></p>
      <div class="article-media" data-article-media></div>
      <div class="article-body" data-article-body></div>
      <section class="article-contact-cta" aria-label="Start a conversation">
        <p class="section-kicker">Let's make it count</p>
        <p>Share a few details and I will get back to you.</p>
        <button type="button" data-chatbot-start>Start a conversation <span aria-hidden="true">&#8594;</span></button>
        <blockquote>"Code is not just what I write, it's how I solve problems."</blockquote>
      </section>
    </article>
  </main>
  <aside class="chatbot-widget" data-chatbot aria-label="Contact assistant">
    <button class="chatbot-widget__launcher" type="button" data-chatbot-open><span class="chatbot-widget__signal" aria-hidden="true"></span>Start a conversation</button>
    <section class="chatbot-widget__window" data-chatbot-window hidden>
      <header><div><p>Mani's assistant</p><span>Available to talk</span></div><button type="button" data-chatbot-close aria-label="Close assistant">&times;</button></header>
      <form data-chatbot-form><div class="chatbot-widget__messages" data-chatbot-messages role="log" aria-live="polite"></div><div class="chatbot-widget__choices" data-chatbot-choices></div><label class="sr-only" data-chatbot-input-label></label><div class="chatbot-widget__composer"><div data-chatbot-input-slot></div><button type="submit" data-chatbot-submit hidden>Next</button></div><p class="chatbot-widget__status" data-chatbot-status aria-live="polite"></p></form>
    </section>
  </aside>
  <script src="/blog-article.js?v=1"></script>
  <script src="/chat-widget.js?v=3"></script>
</body>
</html>
